<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1 · Desafío final: ¿qué es (y qué no es) un agente? | ENCAMINA × Prosolia Energy</title>
<style>
:root{--sun:#faa418;--grey:#202020;--blue:#454f97;--blue2:#3a4485;--green:#77aa3a;--ok:#517631;--ko:#a11c3b;--ink:#1f2433;--night:#1b2050;--night3:#2f3778;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh}html{background:#1b2050}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#fff;
background:radial-gradient(1000px 600px at 90% -10%,rgba(250,164,24,.18),transparent 60%),radial-gradient(800px 500px at -5% 110%,rgba(119,170,58,.14),transparent 60%),linear-gradient(160deg,var(--night3) 0%,var(--night) 70%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
header{background:#fff;display:flex;align-items:center;gap:20px;padding:14px 32px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
header img{display:block;width:auto}
header .enc{height:30px;filter:brightness(0);opacity:.78}
header .pro{height:54px}
header .x{font-size:26px;color:#9a9a9a;font-weight:300}
header .t{margin-left:auto;color:var(--ink);font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
header .t span{background:var(--green);color:#16240a;padding:3px 12px;border-radius:999px;font-size:15px}
main{max-width:1100px;margin:0 auto;padding:36px 24px 56px}
.kicker{font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun);font-weight:700}
h1{font-size:clamp(34px,5vw,60px);font-weight:300;line-height:1.08;margin:12px 0 14px}
h1 em{font-style:normal;font-weight:600;color:var(--green)}
.lead{font-size:clamp(18px,2vw,23px);color:rgba(255,255,255,.88);line-height:1.45;max-width:760px}
.intro{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:end}
.intro img{width:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.btn{border:0;border-radius:12px;padding:0 26px;height:58px;font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.14);color:#fff}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.primary{background:var(--sun);color:var(--grey)}
.btn.primary:hover{background:#ffb63f}
.btn[disabled]{opacity:.4;cursor:default}
.top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.pill{font-size:14px;font-weight:700;letter-spacing:.08em;padding:6px 14px;border-radius:999px;background:var(--sun);color:var(--grey)}
.count{margin-left:auto;font-size:22px;font-weight:600}
.count small{color:rgba(255,255,255,.6);font-weight:400}
.prog{display:flex;gap:5px;margin-bottom:22px}
.seg{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.16)}
.seg.cur{background:var(--sun)}
.seg.okk{background:var(--green)}
.seg.bad{background:#e25b7b}
.qcard{background:#fff;color:var(--ink);border-radius:20px;padding:24px 30px;box-shadow:0 12px 28px rgba(0,0,0,.25)}
.ctx{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--blue);padding:5px 12px;border-radius:999px;margin-bottom:10px}
.q{font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.3;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:16px;background:rgba(255,255,255,.96);color:var(--ink);padding:14px 18px;font-size:clamp(16px,1.6vw,20px);font-weight:600;line-height:1.3;min-height:78px;transition:transform .12s,opacity .25s}
.opt:hover:not([disabled]){transform:translateY(-2px)}
.opt[disabled]{cursor:default}
.opt .L{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:22px;font-weight:700}
.done .opt{opacity:.42}
.done .opt.right{opacity:1;background:var(--ok);color:#fff}
.done .opt.wrong{opacity:1;background:var(--ko);color:#fff}
.done .opt.right .L,.done .opt.wrong .L{background:#fff;color:var(--ink)}
.expl{margin-top:18px;background:#fff;color:var(--ink);border-radius:18px;padding:18px 24px;border-left:10px solid var(--ok);animation:fade .35s ease}
.expl.n{border-left-color:var(--ko)}
.expl b{display:block;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.expl.n b{color:var(--ko)}
.expl p{margin:0;font-size:19px;line-height:1.45}
.nav{display:flex;justify-content:flex-end;margin-top:20px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.res{text-align:center}
.score{font-size:clamp(70px,12vw,130px);font-weight:300;line-height:1;margin:10px 0}
.score small{font-size:.4em;color:rgba(255,255,255,.6)}
.msg{display:inline-block;background:#fff;color:var(--ink);border-radius:18px;padding:18px 28px;font-size:clamp(20px,2.4vw,28px);font-weight:600;border-left:10px solid var(--c,var(--green));max-width:820px;margin:6px 0 26px}
.res img{height:170px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;text-align:left;margin:10px 0 26px}
.ri{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.3;display:flex;gap:10px}
.ri .b{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--ok)}
.ri.n .b{background:var(--ko)}
@media (max-width:720px){.opts{grid-template-columns:1fr}.intro{grid-template-columns:1fr}.intro img{width:140px}header{padding:10px 16px;flex-wrap:wrap}header .t{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var Q=[{"ctx": "Permisos", "q": "El creador del «Copiloto O&M» añadió como conocimiento una carpeta de SharePoint de Financiación a la que él sí tiene acceso. Un técnico sin acceso a esa carpeta pregunta por el warehouse. ¿Qué ocurre?", "opts": [["A", "Responde solo si los archivos de esa carpeta están en PDF."], ["B", "El agente no usa ese contenido para él: solo responde con lo que ese técnico ya puede ver."], ["C", "El agente pide permiso al creador en tiempo real y luego responde."], ["D", "Responde con los datos, porque el agente hereda los permisos de quien lo creó."]], "why": "Con fuentes de SharePoint, el agente respeta los permisos y etiquetas de quien pregunta: si no tiene acceso, ese contenido no entra en su respuesta. Nunca ve más que la persona.", "a": "B"}, {"ctx": "Concepto", "q": "¿Qué describe mejor un agente de Microsoft 365 Copilot como los que construiremos en este programa?", "opts": [["A", "Un programa que trabaja solo en segundo plano sin que nadie lo invoque."], ["B", "Una macro de Office que se programa en lenguaje natural."], ["C", "Un modelo de IA distinto y más potente que el de Copilot Chat."], ["D", "Copilot con un trabajo concreto: instrucciones, conocimiento y capacidades guardados para reutilizarlos."]], "why": "El motor es Copilot; lo que cambia es el contexto «almacenado» y reutilizable, como un BESS. No es un modelo nuevo ni trabaja solo por defecto.", "a": "D"}, {"ctx": "Instrucciones vs. conocimiento", "q": "Quieres que el agente responda siempre en una tabla «Planta · Incidencia · Prioridad · Procedimiento». ¿Dónde lo indicas?", "opts": [["A", "En las instrucciones."], ["B", "En el nombre del agente."], ["C", "En un documento de conocimiento llamado «Formato.docx»."], ["D", "En las solicitudes de inicio."]], "why": "Formato, tono, pasos y límites son comportamiento: van en instrucciones (el sistema de control). El conocimiento aporta el contenido, no el modo de responder.", "a": "A"}, {"ctx": "Alucinaciones", "q": "El agente afirma que el plazo para cerrar una incidencia P2 es de 48 h, pero ese dato no aparece en ningún documento de sus fuentes. ¿Qué es lo más correcto?", "opts": [["A", "Preguntarle «¿estás seguro?» y aceptar lo que conteste."], ["B", "Darlo por bueno: si el agente lo dice, estará en alguna fuente."], ["C", "Tratarlo como posible invención: comprobar la cita y reforzar en instrucciones qué responder cuando algo no consta."], ["D", "Subir más documentos hasta que el agente lo confirme."]], "why": "Los modelos generan texto plausible. Pedir siempre la cita (documento y apartado), definir la respuesta «No consta en la documentación» y revisar es la forma de trabajar.", "a": "C"}, {"ctx": "Chat o agente", "q": "Pedro ha afinado en Copilot Chat un prompt largo con el formato de clasificación de incidencias y 3 documentos adjuntos. Quiere que los 12 técnicos trabajen igual. ¿Qué es lo más eficaz?", "opts": [["A", "Reenviar por correo la conversación de Copilot a todo el equipo."], ["B", "Nada: Copilot aprende solo el formato del equipo con el uso."], ["C", "Convertirlo en un agente con esas instrucciones y ese conocimiento, y compartirlo con el equipo."], ["D", "Que cada técnico copie el prompt y adjunte los documentos cada vez."]], "why": "Copilot Chat es generación sin almacenamiento: cada vez hay que dar el contexto. El agente lo guarda y lo entrega igual a todo el equipo.", "a": "C"}, {"ctx": "Capacidades", "q": "¿Qué puede hacer un agente creado con Agent Builder, tal cual, sin pasar a Copilot Studio?", "opts": [["A", "Analizar el Excel de incidencias con el intérprete de código y generar un gráfico."], ["B", "Ejecutarse cada lunes a las 8:00 sin que nadie lo invoque."], ["C", "Crear órdenes de trabajo en el GMAO mediante una acción con API."], ["D", "Escribir consignas en el SCADA de la planta."]], "why": "Agent Builder incluye intérprete de código y generador de imágenes. Las acciones sobre servicios externos, los flujos y los disparadores se construyen en Copilot Studio.", "a": "A"}, {"ctx": "Conectores", "q": "Sobre los conectores de Microsoft 365 Copilot, ¿qué afirmación es correcta?", "opts": [["A", "Dan al agente permiso de escritura sobre el sistema externo."], ["B", "Sustituyen a los permisos de Microsoft 365."], ["C", "Cualquier persona conecta su agente al ERP pegando la URL del sistema."], ["D", "Llevan a Copilot datos de sistemas externos (tickets, bases de conocimiento…), y TI debe habilitarlos y configurarlos."]], "why": "Son la «conexión a red» con otros sistemas. Los habilita y configura el administrador en el centro de administración de Microsoft 365, y se respetan los permisos.", "a": "D"}, {"ctx": "Microsoft Graph", "q": "María, con licencia de Microsoft 365 Copilot, pregunta sin adjuntar nada: «¿Qué acordamos ayer con el cliente de Stellantis Zaragoza?». ¿De dónde puede salir la respuesta?", "opts": [["A", "Solo de Internet."], ["B", "De su correo, chats, reuniones y archivos a los que ella ya tiene acceso."], ["C", "De ningún sitio: siempre hay que adjuntar el documento."], ["D", "De los buzones de todo el equipo comercial de Prosolia."]], "why": "Copilot con licencia se fundamenta en los datos de trabajo del usuario vía Microsoft Graph, siempre dentro de sus permisos: nunca ve lo que María no puede ver.", "a": "B"}, {"ctx": "Autonomía", "q": "¿Qué describe mejor los agentes que crearemos en T3 con Agent Builder?", "opts": [["A", "Responden cuando alguien los usa; la persona revisa el resultado y decide."], ["B", "Se reentrenan con cada conversación y mejoran solos."], ["C", "Envían correos a clientes sin pedir confirmación."], ["D", "Actúan solos y toman decisiones de negocio sin supervisión."]], "why": "Son agentes conversacionales: tú los invocas y tú decides. Los agentes autónomos con disparadores se diseñan en Copilot Studio, con su gobierno.", "a": "A"}, {"ctx": "Archivos subidos", "q": "Subes al agente (desde tu equipo) un Excel con salarios para que RR. HH. calcule bandas, y compartes el agente con toda la organización. ¿Cuál es el riesgo?", "opts": [["A", "Solo los administradores pueden ver ese archivo."], ["B", "Ninguno: el agente aplica los permisos del Excel original de tu equipo."], ["C", "Cualquiera que use el agente puede obtener respuestas basadas en ese archivo subido."], ["D", "El archivo se borra automáticamente al compartir el agente."]], "why": "Los archivos subidos quedan incrustados en el agente: quien tiene acceso al agente accede a su información. Datos sensibles, mejor en SharePoint con permisos o fuera del agente.", "a": "C"}, {"ctx": "Descripción", "q": "Además de informar a las personas, ¿para qué sirve la descripción del agente?", "opts": [["A", "Limita cuántas personas pueden usarlo."], ["B", "Ayuda al modelo a identificar para qué tareas y situaciones usar el agente."], ["C", "Es decorativa: no influye en nada."], ["D", "Define qué permisos tiene el agente sobre SharePoint."]], "why": "La descripción es la placa de características: corta, precisa y clara. La lee la gente y también el modelo para decidir cuándo encaja el agente.", "a": "B"}, {"ctx": "Qué ve y qué no", "q": "El agente tiene como conocimiento el SharePoint de O&M. Un técnico le pregunta: «¿Qué alarma está activa ahora mismo en el inversor 3 de Albispark?». ¿Qué cabe esperar?", "opts": [["A", "Lo sabe si el técnico escribe la pregunta en mayúsculas."], ["B", "Lo deduce de la irradiación de la web de AEMET."], ["C", "Lo consulta en el SCADA, porque O&M y SCADA son del mismo departamento."], ["D", "No puede saberlo: no lee señales en tiempo real del SCADA; como mucho, lo que esté documentado."]], "why": "El agente responde con sus fuentes de conocimiento. Las señales en vivo del SCADA no están ahí: para eso está el SCADA. Un buen agente lo dice y orienta al procedimiento.", "a": "D"}];

var app=document.getElementById('app');
var idx=0,ans=[];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function start(){
  app.innerHTML='<div class="intro"><div><div class="kicker">#AgentesProsolia · Desafío final</div>'+
  '<h1>¿Qué es (y qué no es) un <em>agente</em>?</h1>'+
  '<p class="lead">'+Q.length+' preguntas sobre permisos, conocimiento, verificación, conectores y autonomía. Elige una respuesta en cada pregunta y descubre al final cuántas has acertado.</p>'+
  '<p style="margin-top:26px"><button class="btn primary" id="go" type="button">Empezar</button></p></div>'+
  '<img src="'+MASCOT+'" alt=""></div>';
  document.getElementById('go').addEventListener('click',function(){idx=0;ans=[];question();});
}
function question(){
  var it=Q[idx],a=ans[idx],done=a!==undefined;
  var prog=Q.map(function(q,i){var c='seg';if(i===idx)c+=' cur';else if(ans[i]!==undefined)c+=ans[i]===q.a?' okk':' bad';return '<span class="'+c+'"></span>';}).join('');
  var opts=it.opts.map(function(o){var c='opt';if(done&&o[0]===it.a)c+=' right';if(done&&a===o[0]&&a!==it.a)c+=' wrong';
    return '<button type="button" class="'+c+'" data-k="'+o[0]+'"'+(done?' disabled':'')+'><span class="L">'+o[0]+'</span><span>'+esc(o[1])+'</span></button>';}).join('');
  var expl='';
  if(done){var ok=a===it.a;expl='<div class="expl'+(ok?'':' n')+'"><b>'+(ok?'¡Correcto!':'No exactamente · la respuesta es la '+it.a)+'</b><p>'+esc(it.why)+'</p></div>';}
  var last=idx===Q.length-1;
  app.innerHTML='<div class="top"><span class="pill">DESAFÍO FINAL</span><span class="count">'+(idx+1)+' <small>/ '+Q.length+'</small></span></div>'+
  '<div class="prog" aria-hidden="true">'+prog+'</div>'+
  '<div class="'+(done?'done':'')+'"><div class="qcard"><span class="ctx">'+esc(it.ctx)+'</span><p class="q">'+esc(it.q)+'</p></div>'+
  '<div class="opts" role="group" aria-label="Opciones">'+opts+'</div></div>'+expl+
  '<div class="nav"><button type="button" class="btn primary" id="nx"'+(done?'':' disabled')+'>'+(last?'Ver mi resultado':'Siguiente')+' →</button></div>';
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.addEventListener('click',function(){if(ans[idx]!==undefined)return;ans[idx]=b.getAttribute('data-k');question();var n=document.getElementById('nx');if(n)n.focus();});});
  document.getElementById('nx').addEventListener('click',function(){if(ans[idx]===undefined)return;if(last)result();else{idx++;question();window.scrollTo(0,0);}});
}
function result(){
  var ok=0;Q.forEach(function(q,i){if(ans[i]===q.a)ok++;});
  var m,c;
  if(ok<=4){m='No te preocupes: en las próximas sesiones aprenderás lo necesario.';c='#faa418';}
  else if(ok<=8){m='¡Vas por buen camino! Con lo que veremos en las próximas sesiones lo bordarás.';c='#6da6d9';}
  else{m='¡Lo has hecho muy bien! Ya comprendes las bases de lo que es un agente.';c='#77aa3a';}
  var rev=Q.map(function(q,i){var g=ans[i]===q.a;return '<div class="ri'+(g?'':' n')+'"><span class="b">'+(g?'✓':'✗')+'</span><span>'+(i+1)+'. '+esc(q.ctx)+' · correcta: '+q.a+'</span></div>';}).join('');
  app.innerHTML='<div class="res"><div class="kicker">Tu resultado</div><div class="score">'+ok+'<small> / '+Q.length+'</small></div>'+
  '<div class="msg" style="--c:'+c+'">'+m+'</div><div><img src="'+MASCOT+'" alt=""></div>'+
  '<div class="review">'+rev+'</div><button type="button" class="btn primary" id="again">Volver a intentarlo</button></div>';
  document.getElementById('again').addEventListener('click',function(){idx=0;ans=[];question();window.scrollTo(0,0);});
  window.scrollTo(0,0);
}
start();
})();
